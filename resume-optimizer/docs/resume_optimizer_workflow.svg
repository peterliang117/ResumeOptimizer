<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280">
  <defs>
    <style>
      .bg{fill:#f6f7f9}
      .title{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:54px;font-weight:700;fill:#1b1f24}
      .sub{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:24px;fill:#5f6b7a}
      .card{fill:#fff;stroke:#d7dce2;stroke-width:1.5}
      .gate{fill:#fff;stroke:#0b6bcb;stroke-width:3}
      .warn{fill:#fff7e6;stroke:#d18b00;stroke-width:2}
      .done{fill:#ecf8ef;stroke:#35a853;stroke-width:2}
      .h{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:23px;font-weight:700;fill:#1b1f24}
      .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:18px;fill:#364150}
      .small{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:16px;fill:#5f6b7a}
      .num{fill:#0b6bcb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:18px;font-weight:700}
      .arrow{stroke:#7a8594;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .soft{fill:#edf5ff;stroke:#b9d8f6}
      .blue{fill:#0b6bcb}
      .green{fill:#35a853}
      .orange{fill:#d18b00}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#7a8594" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="bg" width="1800" height="1280"/>
  <text class="title" x="80" y="92">Automated Job Application Workflow</text>
  <text class="sub" x="82" y="130">LinkedIn search, match scoring, truth-first resume tailoring, fact-gated form fill, and local tracking</text>

  <g>
    <rect class="soft" x="90" y="158" width="455" height="54" rx="12"/>
    <text class="small" x="115" y="192">Respect LinkedIn and ATS login, rate limit, and anti-bot controls</text>
    <rect class="soft" x="610" y="158" width="505" height="54" rx="12"/>
    <text class="small" x="635" y="192">OpenAI API optional; Codex/local review remains available</text>
    <rect class="soft" x="1180" y="158" width="530" height="54" rx="12"/>
    <text class="small" x="1205" y="192">Private files, resumes, applications, and tracker stay out of Git</text>
  </g>

  <g class="shadow">
    <rect class="card" x="80" y="270" width="300" height="185" rx="16"/>
    <text class="num" x="110" y="312">01</text>
    <text class="h" x="150" y="312">Search LinkedIn</text>
    <text class="t" x="110" y="356">Recent Data Engineer roles</text>
    <text class="t" x="110" y="388">Target pay from private criteria</text>
    <text class="t" x="110" y="420">Use logged-in browser session</text>
  </g>
  <path class="arrow" d="M380 362 H455"/>

  <g class="shadow">
    <rect class="card" x="455" y="270" width="300" height="185" rx="16"/>
    <text class="num" x="485" y="312">02</text>
    <text class="h" x="525" y="312">Capture Job</text>
    <text class="t" x="485" y="356">Open job post or ATS link</text>
    <text class="t" x="485" y="388">Read job description</text>
    <text class="t" x="485" y="420">Save JD and queue item</text>
  </g>
  <path class="arrow" d="M755 362 H830"/>

  <g class="shadow">
    <rect class="card" x="830" y="270" width="300" height="185" rx="16"/>
    <text class="num" x="860" y="312">03</text>
    <text class="h" x="900" y="312">Score Match</text>
    <text class="t" x="860" y="356">Resume and profile evidence</text>
    <text class="t" x="860" y="388">Skills, seniority, pay, recency</text>
    <text class="t" x="860" y="420">Reject low-match jobs</text>
  </g>
  <path class="arrow" d="M1130 362 H1205"/>

  <g class="shadow">
    <rect class="gate" x="1205" y="270" width="300" height="185" rx="16"/>
    <circle class="blue" cx="1240" cy="306" r="16"/>
    <path d="M1232 306 l6 6 l13 -15" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="h" x="1270" y="312">High-Match Gate</text>
    <text class="t" x="1235" y="356">Continue only if score passes</text>
    <text class="t" x="1235" y="388">Confirm job is worth applying</text>
    <text class="t" x="1235" y="420">Create application packet</text>
  </g>

  <path class="arrow" d="M1355 455 V545"/>

  <g class="shadow">
    <rect class="card" x="1205" y="545" width="300" height="185" rx="16"/>
    <text class="num" x="1235" y="587">04</text>
    <text class="h" x="1275" y="587">Tailor Resume</text>
    <text class="t" x="1235" y="631">Propose edits only from</text>
    <text class="t" x="1235" y="663">resume and facts.md</text>
    <text class="t" x="1235" y="695">Preserve one-page DOCX</text>
  </g>
  <path class="arrow" d="M1205 638 H1130"/>

  <g class="shadow">
    <rect class="gate" x="530" y="545" width="600" height="185" rx="18"/>
    <circle class="blue" cx="580" cy="590" r="18"/>
    <path d="M571 590 l7 7 l16 -18" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="h" x="615" y="598">Resume Edit Review Gate</text>
    <text class="t" x="580" y="646">Show wording, reason, evidence, and truth risk</text>
    <text class="t" x="580" y="678">Apply only approved edits to a resume copy</text>
    <text class="t" x="580" y="710">Run LibreOffice render check and keep one page</text>
  </g>
  <path class="arrow" d="M530 638 H455"/>

  <g class="shadow">
    <rect class="card" x="80" y="545" width="375" height="185" rx="16"/>
    <text class="num" x="110" y="587">05</text>
    <text class="h" x="150" y="587">Open Application</text>
    <text class="t" x="110" y="631">LinkedIn Easy Apply or external ATS</text>
    <text class="t" x="110" y="663">Upload tailored resume</text>
    <text class="t" x="110" y="695">Use browser-assisted filling</text>
  </g>

  <path class="arrow" d="M268 730 V820"/>

  <g class="shadow">
    <rect class="card" x="80" y="820" width="375" height="185" rx="16"/>
    <text class="num" x="110" y="862">06</text>
    <text class="h" x="150" y="862">Private Fact Sources</text>
    <text class="t" x="110" y="906">profile/facts.md</text>
    <text class="t" x="110" y="938">profile/application_answers.json</text>
    <text class="t" x="110" y="970">Ignored by Git and kept local</text>
  </g>
  <path class="arrow" d="M455 912 H530"/>

  <g class="shadow">
    <rect class="warn" x="530" y="820" width="600" height="185" rx="18"/>
    <circle class="orange" cx="580" cy="865" r="18"/>
    <text x="574" y="872" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">?</text>
    <text class="h" x="615" y="873">Fact-Gated Approval</text>
    <text class="t" x="580" y="921">Auto-fill and auto-approve only when exact answers are covered</text>
    <text class="t" x="580" y="953">Covered answers must come from local private profile files</text>
    <text class="t" x="580" y="985">If missing, ambiguous, or differently worded, stop and ask</text>
  </g>
  <path class="arrow" d="M1130 912 H1205"/>

  <g class="shadow">
    <rect class="done" x="1205" y="820" width="300" height="185" rx="16"/>
    <circle class="green" cx="1240" cy="865" r="18"/>
    <path d="M1231 865 l7 7 l16 -18" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="h" x="1275" y="873">Submit</text>
    <text class="t" x="1235" y="921">Proceed only when all</text>
    <text class="t" x="1235" y="953">required facts are covered</text>
    <text class="t" x="1235" y="985">and final submit is allowed</text>
  </g>

  <g class="shadow">
    <rect class="card" x="455" y="1095" width="1050" height="105" rx="16"/>
    <text class="num" x="490" y="1157">07</text>
    <text class="h" x="530" y="1157">Track Application Locally</text>
    <text class="t" x="820" y="1157">Update tracker/applications.csv and keep artifacts under applications/</text>
  </g>
  <path class="arrow" d="M1355 1005 V1095"/>
</svg>
