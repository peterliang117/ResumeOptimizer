<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <style>
      .bg{fill:#f5f5f7}.title{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Arial,sans-serif;font-size:54px;font-weight:700;fill:#1d1d1f}.sub{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Arial,sans-serif;font-size:24px;fill:#6e6e73}.card{fill:#fff;stroke:#d2d2d7;stroke-width:1.5}.cardBlue{fill:#fff;stroke:#0071e3;stroke-width:3}.h{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Arial,sans-serif;font-size:23px;font-weight:700;fill:#1d1d1f}.t{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Arial,sans-serif;font-size:18px;fill:#424245}.small{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Arial,sans-serif;font-size:16px;fill:#6e6e73}.num{fill:#0071e3;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Arial,sans-serif;font-size:18px;font-weight:700}.arrow{stroke:#86868b;stroke-width:2;fill:none;marker-end:url(#arrow)}.blue{fill:#0071e3}.pill{fill:#e8f2ff;stroke:#b8d8ff}.shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.09"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10" fill="none" stroke="#86868b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect class="bg" width="1800" height="1120"/>
  <text class="title" x="90" y="95">Resume Optimizer Workflow</text>
  <text class="sub" x="92" y="133">Truth-first tailoring, mandatory chat review, one-page validation, manual submit only</text>

  <g class="shadow">
    <rect class="card" x="70" y="200" width="300" height="190" rx="28"/>
    <text class="num" x="100" y="240">01</text><text class="h" x="140" y="240">Inputs</text>
    <text class="t" x="100" y="284">Master DOCX resume</text>
    <text class="t" x="100" y="316">profile/facts.md truth source</text>
    <text class="t" x="100" y="348">Job URL or pasted JD</text>
  </g>
  <path class="arrow" d="M370 295 H430"/>

  <g class="shadow">
    <rect class="card" x="430" y="200" width="300" height="190" rx="28"/>
    <text class="num" x="460" y="240">02</text><text class="h" x="500" y="240">Capture Job</text>
    <text class="t" x="460" y="284">Fetch public job text</text>
    <text class="t" x="460" y="316">If blocked, paste JD into</text>
    <text class="t" x="460" y="348">job_description.txt</text>
  </g>
  <path class="arrow" d="M730 295 H790"/>

  <g class="shadow">
    <rect class="card" x="790" y="200" width="300" height="190" rx="28"/>
    <text class="num" x="820" y="240">03</text><text class="h" x="860" y="240">Parse Resume</text>
    <text class="t" x="820" y="284">Read DOCX body + tables</text>
    <text class="t" x="820" y="316">Preserve formatting base</text>
    <text class="t" x="820" y="348">Original unchanged</text>
  </g>
  <path class="arrow" d="M1090 295 H1150"/>

  <g class="shadow">
    <rect class="card" x="1150" y="200" width="300" height="190" rx="28"/>
    <text class="num" x="1180" y="240">04</text><text class="h" x="1220" y="240">Analyze Fit</text>
    <text class="t" x="1180" y="284">OpenAI API if configured</text>
    <text class="t" x="1180" y="316">Fallback keyword scan</text>
    <text class="t" x="1180" y="348">No unsupported claims</text>
  </g>
  <path class="arrow" d="M1450 295 H1510"/>

  <g class="shadow">
    <rect class="card" x="1510" y="200" width="220" height="190" rx="28"/>
    <text class="num" x="1540" y="240">05</text><text class="h" x="1580" y="240">Edits</text>
    <text class="t" x="1540" y="284">proposed_edits.json</text>
    <text class="t" x="1540" y="316">Supported lines only</text>
    <text class="t" x="1540" y="348">Low truth risk</text>
  </g>

  <path class="arrow" d="M1620 390 V465 H900 V520"/>
  <g class="shadow">
    <rect class="cardBlue" x="610" y="520" width="580" height="210" rx="32"/>
    <circle class="blue" cx="660" cy="565" r="18"/><path d="M651 565 l7 7 l15 -17" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="h" x="695" y="573">06 Mandatory Chat Review Gate</text>
    <text class="t" x="650" y="620">Show original to suggested wording</text>
    <text class="t" x="650" y="652">Explain reason, evidence source, truth risk</text>
    <text class="t" x="650" y="684">User approves all, selected edits, or none</text>
    <text class="t" x="650" y="716">No edits applied before approval</text>
  </g>

  <path class="arrow" d="M1190 625 H1260"/>
  <g class="shadow">
    <rect class="card" x="1260" y="520" width="420" height="210" rx="28"/>
    <text class="num" x="1290" y="565">07</text><text class="h" x="1330" y="565">Generate Resume</text>
    <text class="t" x="1290" y="610">Apply accepted edits to copy</text>
    <text class="t" x="1290" y="642">Zicong_Liang_Company_Role_Resume.docx</text>
    <text class="t" x="1290" y="674">Original resume unchanged</text>
  </g>

  <path class="arrow" d="M1260 625 H1190"/>
  <path class="arrow" d="M610 625 H500"/>
  <g class="shadow">
    <rect class="card" x="120" y="520" width="380" height="210" rx="28"/>
    <text class="num" x="150" y="565">08</text><text class="h" x="190" y="565">Validate One Page</text>
    <text class="t" x="150" y="610">LibreOffice render check</text>
    <text class="t" x="150" y="642">render_check/same-name.pdf</text>
    <text class="t" x="150" y="674">If more than 1 page, shorten and recheck</text>
  </g>

  <path class="arrow" d="M500 730 V805 H610"/>
  <g class="shadow">
    <rect class="card" x="610" y="805" width="460" height="210" rx="28"/>
    <text class="num" x="640" y="850">09A</text><text class="h" x="695" y="850">applications/&lt;job&gt;/</text>
    <text class="t" x="640" y="895">Resume DOCX + render PDF</text>
    <text class="t" x="640" y="927">fit_analysis.json</text>
    <text class="t" x="640" y="959">job_description.txt + proposed_edits.json</text>
  </g>

  <path class="arrow" d="M1070 910 H1140"/>
  <g class="shadow">
    <rect class="card" x="1140" y="805" width="360" height="210" rx="28"/>
    <text class="num" x="1170" y="850">09B</text><text class="h" x="1225" y="850">tailored_resumes/</text>
    <text class="t" x="1170" y="895">Quick-access final copies</text>
    <text class="t" x="1170" y="927">Same standardized filename</text>
    <text class="t" x="1170" y="959">Application packet remains source</text>
  </g>

  <g>
    <rect class="pill" x="105" y="430" width="430" height="56" rx="18"/>
    <text class="small" x="130" y="465">Optional only when requested: cover letter, recruiter message</text>
    <rect class="pill" x="585" y="430" width="510" height="56" rx="18"/>
    <text class="small" x="610" y="465">Private data excluded from Git: resumes, applications, tracker, outputs</text>
    <rect class="pill" x="1145" y="430" width="250" height="56" rx="18"/>
    <text class="small" x="1175" y="465">Manual submit only</text>
  </g>
</svg>
